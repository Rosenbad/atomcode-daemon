<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtomCode Daemon</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg2: #111820;
    --bg3: #182230;
    --bg4: #1e2a3a;
    --border: #2a3440;
    --border2: #3a4860;
    --text: #e2e8f0;
    --text2: #8899b4;
    --text3: #5a6a84;
    --accent: #60b0ff;
    --accent2: #2a7ae0;
    --accent3: #1a5ab0;
    --green: #4ade80;
    --red: #f87171;
    --red2: #dc2626;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --purple: #a78bfa;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif;
    --radius: 8px;
    --radius2: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow2: 0 8px 40px rgba(0,0,0,0.4);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    display: flex;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px; min-width: 260px; background: linear-gradient(180deg, var(--bg2) 0%, #0e1620 100%);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  .sidebar-header {
    padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header .logo {
    width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; box-shadow: 0 2px 8px rgba(42,122,224,0.3);
  }
  .sidebar-header .title { font-size: 14px; font-weight: 600; letter-spacing: 0.3px; }
  .sidebar-header .subtitle { font-size: 11px; color: var(--text3); margin-left: auto; }

  .sidebar-search-wrap {
    padding: 10px 12px 6px; position: relative;
  }
  .sidebar-search-wrap .search-icon {
    position: absolute; left: 20px; top: 18px; font-size: 12px; color: var(--text3); pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 7px 10px 7px 28px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 12px; outline: none; transition: border-color var(--transition);
  }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--text3); }

  .session-list-wrap {
    flex: 1; overflow-y: auto; padding: 4px 8px 8px;
  }
  .session-list { min-height: 100%; }
  .session-empty {
    padding: 32px 16px; text-align: center; color: var(--text3); font-size: 13px;
  }
  .session-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
    transition: all var(--transition); position: relative; border: 1px solid transparent;
  }
  .session-item:hover { background: var(--bg3); border-color: var(--border); }
  .session-item.active {
    background: var(--bg4); border-color: var(--accent3); color: var(--accent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .session-item .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0;
    transition: all var(--transition);
  }
  .session-item.active .dot { background: var(--accent); box-shadow: 0 0 6px rgba(96,176,255,0.4); }
  .session-item .sess-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item .sess-time {
    font-size: 11px; color: var(--text3); flex-shrink: 0;
  }
  .session-item .sess-actions {
    display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    gap: 2px; z-index: 5;
  }
  .session-item:hover .sess-actions { display: flex; }
  .sess-action-btn {
    width: 22px; height: 22px; border-radius: 4px; border: none;
    background: var(--bg3); color: var(--text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    transition: all 0.15s;
  }
  .sess-action-btn:hover { background: var(--border); color: var(--text); }
  .sess-action-btn.danger:hover { background: var(--red2); color: #fff; }

  .sidebar-actions {
    padding: 10px 12px 14px; border-top: 1px solid var(--border);
    display: flex; gap: 6px;
  }
  .sidebar-actions .btn-sm {
    flex: 1; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text2); cursor: pointer; font-size: 12px;
    transition: all var(--transition); text-align: center;
  }
  .sidebar-actions .btn-sm:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .sidebar-actions .btn-sm.primary { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .sidebar-actions .btn-sm.primary:hover { background: var(--accent); }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ── Top Bar ── */
  .topbar {
    height: 48px; min-height: 48px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px; background: var(--bg2);
  }
  .topbar .project-info {
    font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; display: flex; align-items: center; gap: 6px;
  }
  .topbar .project-info span { color: var(--text); font-weight: 500; }
  .topbar .select-group {
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3);
  }
  .topbar select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    outline: none; max-width: 140px;
  }
  .topbar select:focus { border-color: var(--accent); }

  .connection-status {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green);
    padding: 2px 8px; border-radius: 10px; background: rgba(74,222,128,0.1);
    white-space: nowrap;
  }
  .connection-status .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot { 50% { opacity: 0.5; } }
  .connection-status.disconnected { color: var(--text3); }
  .connection-status.disconnected .dot { background: var(--text3); animation: none; }

  /* ── Chat ── */
  .chat {
    flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth;
  }
  .chat-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text3); gap: 16px;
  }
  .chat-empty .big-icon {
    font-size: 56px; opacity: 0.15; filter: grayscale(1);
  }
  .chat-empty p { font-size: 14px; }
  .chat-empty .hint { font-size: 12px; color: var(--text3); }

  /* ── Message ── */
  .msg {
    display: flex; gap: 12px; margin-bottom: 16px; max-width: 820px;
    margin-left: auto; margin-right: auto; position: relative;
    animation: msg-in 0.2s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; margin-top: 2px;
  }
  .msg.user .msg-avatar { background: var(--bg4); color: var(--text2); }
  .msg.assistant .msg-avatar {
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    color: #fff; box-shadow: 0 2px 8px rgba(42,122,224,0.25);
  }
  .msg-body { flex: 1; min-width: 0; }
  .msg-meta {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .msg-role {
    font-size: 12px; font-weight: 600; color: var(--text2);
  }
  .msg.assistant .msg-role { color: var(--accent); }
  .msg-time {
    font-size: 11px; color: var(--text3);
  }
  .msg-content {
    font-family: var(--mono); font-size: 13px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    padding: 10px 14px; border-radius: var(--radius);
    background: var(--bg2); border: 1px solid var(--border);
  }
  .msg.user .msg-content {
    background: linear-gradient(135deg, var(--bg4), var(--bg3));
    border-color: var(--border2);
  }
  .msg.assistant .msg-content {
    border-left: 2px solid var(--accent3);
  }
  .msg-content p { margin-bottom: 6px; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content code {
    background: var(--bg3); padding: 2px 6px; border-radius: 4px;
    font-size: 12px; color: var(--orange);
  }
  .msg-content pre {
    background: #080c14; border: 1px solid var(--border); border-radius: var(--radius);
    margin: 8px 0; overflow-x: auto; font-size: 12px; line-height: 1.6;
    position: relative;
  }
  .msg-content pre .code-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: var(--bg3); border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text3);
  }
  .msg-content pre .code-header .lang { font-weight: 600; color: var(--text2); }
  .msg-content pre .code-header .copy-btn {
    background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 11px; padding: 2px 8px; border-radius: 4px; transition: all 0.15s;
  }
  .msg-content pre .code-header .copy-btn:hover { background: var(--bg4); color: var(--text); }
  .msg-content pre code {
    display: block; padding: 10px 14px; background: none; color: var(--text);
    font-size: 12px; line-height: 1.6; overflow-x: auto;
  }
  .msg-content a { color: var(--accent); text-decoration: none; }
  .msg-content a:hover { text-decoration: underline; }
  .msg-content blockquote {
    border-left: 3px solid var(--accent3); padding: 4px 12px;
    margin: 8px 0; color: var(--text2); background: var(--bg3);
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .msg-content table {
    border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12px;
  }
  .msg-content th, .msg-content td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .msg-content th { background: var(--bg3); font-weight: 600; }
  .msg-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* Copy button on message */
  .msg-copy-btn {
    position: absolute; right: 8px; top: 8px; z-index: 2;
    opacity: 0; transition: opacity var(--transition);
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 4px 8px; border-radius: 4px;
    cursor: pointer; font-size: 11px;
  }
  .msg:hover .msg-copy-btn { opacity: 1; }
  .msg-copy-btn:hover { background: var(--bg4); color: var(--text); }
  .msg-copy-btn.copied { opacity: 1 !important; color: var(--green); border-color: var(--green); }

  /* Streaming cursor */
  .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: var(--accent); border-radius: 1px;
    animation: blink 0.8s step-end infinite; vertical-align: text-bottom; margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .streaming-info {
    font-size: 11px; color: var(--text3); display: flex; align-items: center;
    gap: 6px; padding: 8px 14px; margin-top: -8px; margin-bottom: 8px;
  }

  /* Status messages */
  .msg.status { justify-content: center; }
  .msg.status .msg-content {
    font-size: 12px; color: var(--text2); text-align: center;
    background: none; border: none; padding: 8px 0;
  }
  .msg.error .msg-content { color: var(--red); }

  /* ── Input ── */
  .input-area {
    padding: 12px 16px 14px; border-top: 1px solid var(--border);
    background: var(--bg2);
  }
  .input-wrap {
    max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius2);
    padding: 8px 10px; transition: border-color var(--transition);
  }
  .input-wrap:focus-within { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(42,122,224,0.15); }
  .input-wrap textarea {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-family: var(--mono); font-size: 13px; line-height: 1.5; resize: none;
    max-height: 150px; min-height: 22px; padding: 2px 0;
  }
  .input-wrap textarea::placeholder { color: var(--text3); }
  .btn-send {
    width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: all 0.15s; flex-shrink: 0;
  }
  .btn-send.send { background: var(--accent2); color: #fff; }
  .btn-send.send:hover { background: var(--accent); transform: scale(1.05); }
  .btn-send.stop { background: var(--red2); color: #fff; }
  .btn-send.stop:hover { background: #b91c1c; transform: scale(1.05); }
  .btn-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .input-hint {
    max-width: 820px; margin: 6px auto 0; font-size: 11px;
    color: var(--text3); text-align: center;
    display: flex; justify-content: center; gap: 16px;
  }
  .input-hint kbd {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px; font-size: 10px; font-family: var(--mono);
  }

  /* ── Image Upload ── */
  .btn-upload {
    width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: all 0.15s; flex-shrink: 0;
    background: transparent; color: var(--text2);
  }
  .btn-upload:hover { background: var(--bg3); color: var(--text); }
  .image-preview-area {
    max-width: 820px; margin: 0 auto;
    display: flex; gap: 8px; padding: 8px 10px 0; flex-wrap: wrap;
  }
  .image-preview-area:empty { display: none; padding: 0; }
  .image-preview-item {
    position: relative; width: 80px; height: 80px; border-radius: 6px;
    overflow: hidden; border: 1px solid var(--border); background: var(--bg3);
  }
  .image-preview-item img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .image-preview-item .remove-btn {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.7); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; opacity: 0; transition: opacity 0.15s;
  }
  .image-preview-item:hover .remove-btn { opacity: 1; }
  .image-preview-item .remove-btn:hover { background: var(--red2); }

  /* Drag & Drop overlay */
  .drop-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(42,122,224,0.12); border: 3px dashed var(--accent);
    pointer-events: none; align-items: center; justify-content: center;
    font-size: 18px; color: var(--accent); backdrop-filter: blur(2px);
  }
  .drop-overlay.active { display: flex; }

  /* Image in message */
  .msg-images {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .msg-images img {
    max-width: 200px; max-height: 200px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); object-fit: contain;
    transition: transform 0.15s, border-color 0.15s;
  }
  .msg-images img:hover { border-color: var(--accent); transform: scale(1.03); }


  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    animation: fade-in 0.15s ease-out;
  }
  .modal-overlay.visible { display: flex; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
    padding: 24px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: var(--shadow2); animation: modal-in 0.2s ease-out;
  }
  @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 {
    font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .modal label {
    display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
    margin-bottom: 12px; font-family: var(--sans);
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .btn {
    padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; transition: all 0.15s;
  }
  .modal .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .modal .btn-secondary:hover { background: var(--bg4); }
  .modal .btn-primary { background: var(--accent2); color: #fff; }
  .modal .btn-primary:hover { background: var(--accent); }
  .modal .btn-danger { background: var(--red2); color: #fff; }
  .modal .btn-danger:hover { background: #b91c1c; }

  .modal .info-row {
    display: flex; justify-content: space-between; font-size: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .modal .info-row .label { color: var(--text2); }
  .modal .info-row .value { color: var(--text); font-family: var(--mono); font-size: 11px; }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    padding: 10px 16px; border-radius: var(--radius); background: var(--bg3);
    border: 1px solid var(--border); color: var(--text); font-size: 13px;
    box-shadow: var(--shadow); pointer-events: auto;
    animation: toast-in 0.2s ease-out; max-width: 360px;
  }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast.info { border-color: var(--accent); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  /* ── Confirm Dialog ── */
  .confirm-text { font-size: 14px; margin-bottom: 16px; color: var(--text2); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">⚛</div>
    <div class="title">AtomCode</div>
    <div class="subtitle" id="versionBadge">v0.1</div>
  </div>
  <div class="sidebar-search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="sessionSearch" placeholder="搜索会话..." oninput="onSearchInput()">
  </div>
  <div class="session-list-wrap">
    <div class="session-list" id="sessionList"></div>
  </div>
  <div class="sidebar-actions">
    <button class="btn-sm primary" onclick="createSession()">＋ 新建</button>
    <button class="btn-sm" onclick="loadSessions()">↻ 刷新</button>
    <button class="btn-sm" onclick="showSettings()">⚙</button>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <!-- Top bar -->
  <div class="topbar">
    <div class="project-info" id="projectInfo">📁 <span>加载中...</span></div>
    <div class="select-group">
      <span>模型</span>
      <select id="providerSelect" onchange="onProviderChange()"><option value="">默认</option></select>
      <select id="modelSelect" onchange="onModelChange()"><option value="">默认</option></select>
    </div>
    <div class="connection-status" id="connStatus">
      <span class="dot"></span>已连接
    </div>
  </div>

  <!-- Chat -->
  <div class="chat" id="chatArea">
    <div class="chat-empty" id="emptyState">
      <div class="big-icon">💬</div>
      <p>选择或创建一个会话开始对话</p>
      <div class="hint">AtomCode AI 编程助手</div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="image-preview-area" id="imagePreviewArea"></div>
    <div class="input-wrap">
      <button class="btn-upload" id="uploadBtn" onclick="triggerUpload()" title="上传图片">📎</button>
      <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="onImageSelected(event)">
      <textarea id="msgInput" placeholder="输入消息…" rows="1" onkeydown="onKeydown(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send send" id="sendBtn" onclick="sendMessage()">▶</button>
    </div>
    <div class="input-hint">
      <span><kbd>Enter</kbd> 发送</span>
      <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
      <span>📎 可拖拽图片</span>
      <span id="msgCount"></span>
    </div>
  </div>
</main>

<!-- Drag & Drop overlay -->
<div class="drop-overlay" id="dropOverlay">📎 释放以添加图片</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙ 设置</h2>
    <label>Daemon 信息</label>
    <div class="info-row"><span class="label">状态</span><span class="value" id="srvStatus">-</span></div>
    <div class="info-row"><span class="label">版本</span><span class="value" id="srvVersion">-</span></div>
    <div class="info-row"><span class="label">运行时间</span><span class="value" id="srvUptime">-</span></div>
    <div class="info-row"><span class="label">CLI 可用</span><span class="value" id="srvCli">-</span></div>
    <div class="info-row"><span class="label">API 地址</span><span class="value">http://127.0.0.1:18788</span></div>
    <label style="margin-top:12px">当前项目</label>
    <div class="info-row"><span class="label">目录</span><span class="value" id="srvDir">-</span></div>
    <div class="info-row" style="margin-top:8px">
      <span class="label" style="align-self:flex-start;padding-top:6px">切换目录</span>
      <div style="flex:1;display:flex;gap:6px">
        <input id="dirInput" type="text" placeholder="输入项目路径 (如 D:\Projects\my-app)" style="flex:1;padding:6px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-family:var(--mono);">
        <button class="btn btn-primary" onclick="changeDir()" style="padding:6px 14px;font-size:12px;white-space:nowrap">切换</button>
      </div>
    </div>
    <div class="info-row"><span class="label">会话数</span><span class="value" id="srvSessions">-</span></div>
    <div class="btn-group" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="closeSettings()">关闭</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── State ──
let sessions = [];
let currentSession = null;
let models = [];
let currentProvider = '';
let currentModel = '';
let isStreaming = false;
let streamStartTime = null;
let streamTimer = null;
let allMessages = []; // full message history for current session
let pendingImages = []; // images staged for next message [{id, url, originalName}]

const API = '';

// ── Init ──
async function init() {
  await Promise.all([loadModels(), loadSessions(), loadProject(), checkHealth()]);
  setupDragDrop();
  if (sessions.length > 0) {
    selectSession(sessions[0].id);
  } else {
    await createSession();
  }
}

// ── Health / Connection ──
async function checkHealth() {
  try {
    const res = await fetch(API + '/health');
    const data = await res.json();
    const el = document.getElementById('connStatus');
    el.className = 'connection-status';
    el.innerHTML = '<span class="dot"></span>已连接';
    document.getElementById('versionBadge').textContent = 'v' + (data.version || '0.1');
    return data;
  } catch (e) {
    const el = document.getElementById('connStatus');
    el.className = 'connection-status disconnected';
    el.innerHTML = '<span class="dot"></span>断开';
    return null;
  }
}

// ── Models ──
async function loadModels() {
  try {
    const res = await fetch(API + '/models');
    const data = await res.json();
    models = [];
    const apiModels = data.models || [];
    for (const m of apiModels) {
      const modelNames = m.models || [];
      for (const modelName of modelNames) {
        models.push({ provider: m.provider, model: modelName });
      }
      if (!modelNames.length) {
        models.push({ provider: m.provider, model: 'default' });
      }
    }
    // Deduplicate providers
    const seenProviders = new Set();
    const ps = document.getElementById('providerSelect');
    ps.innerHTML = '<option value="">默认 Provider</option>';
    for (const m of models) {
      if (seenProviders.has(m.provider)) continue;
      seenProviders.add(m.provider);
      const opt = document.createElement('option');
      opt.value = m.provider; opt.textContent = m.provider;
      if (m.provider === (data.defaultProvider || '')) opt.selected = true;
      ps.appendChild(opt);
    }
    currentProvider = ps.value;
    updateModelOptions(data.defaultModel);
  } catch (e) { console.error('Load models failed:', e); }
}

function updateModelOptions(defaultModel) {
  const ms = document.getElementById('modelSelect');
  ms.innerHTML = '<option value="">默认模型</option>';
  const prov = currentProvider || '';
  const relevant = models.filter(m => !prov || m.provider === prov);
  const seen = new Set();
  let firstModel = null;
  for (const m of relevant) {
    if (!seen.has(m.model)) {
      seen.add(m.model);
      if (!firstModel) firstModel = m.model;
      const opt = document.createElement('option');
      opt.value = m.model; opt.textContent = m.model;
      if (m.model === (defaultModel || '')) opt.selected = true;
      ms.appendChild(opt);
    }
  }
  // Auto-select first model if nothing selected
  if (!ms.value && firstModel) {
    ms.value = firstModel;
  }
  currentModel = ms.value;
}

function onProviderChange() {
  currentProvider = document.getElementById('providerSelect').value;
  updateModelOptions();
}
function onModelChange() {
  currentModel = document.getElementById('modelSelect').value;
}

// ── Project ──
async function loadProject() {
  try {
    const res = await fetch(API + '/project');
    const data = await res.json();
    const name = data.project?.name || data.currentDir?.split(/[/\\]/).pop() || '未知';
    document.getElementById('projectInfo').innerHTML = '📁 <span>' + escHtml(name) + '</span>';
    return data;
  } catch (e) { document.getElementById('projectInfo').innerHTML = '📁 <span class="error">加载失败</span>'; return null; }
}

// ── Sessions ──
async function loadSessions() {
  try {
    const res = await fetch(API + '/sessions');
    const data = await res.json();
    sessions = data.sessions || [];
    renderSessions();
  } catch (e) { console.error('Load sessions failed:', e); }
}

function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  if (sessions.length === 0) {
    list.innerHTML = '<div class="session-empty">暂无会话，点击 ＋ 新建</div>';
    return;
  }
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session-item' + (currentSession?.id === s.id ? ' active' : '');
    div.dataset.id = s.id;
    div.innerHTML =
      '<div class="dot"></div>' +
      '<div class="sess-title" title="' + escHtml(s.title) + '">' + escHtml(s.title) + '</div>' +
      '<div class="sess-time">' + formatTime(s.updatedAt) + '</div>' +
      '<div class="sess-actions">' +
        '<button class="sess-action-btn" onclick="event.stopPropagation();renameSession(\'' + s.id + '\')" title="重命名">✎</button>' +
        '<button class="sess-action-btn danger" onclick="event.stopPropagation();deleteSession(\'' + s.id + '\')" title="删除">✕</button>' +
      '</div>';
    div.onclick = () => selectSession(s.id);
    list.appendChild(div);
  }
}

function selectSession(id) {
  currentSession = sessions.find(s => s.id === id);
  if (!currentSession) return;
  renderSessions();
  renderMessages(currentSession.messages || []);
  document.getElementById('sessionSearch').value = '';
  updateMsgCount();
}

async function createSession() {
  try {
    const res = await fetch(API + '/sessions', { method: 'POST' });
    const data = await res.json();
    await loadSessions();
    selectSession(data.session?.id || data.id);
    showToast('已创建新会话', 'success');
  } catch (e) { showToast('创建会话失败', 'error'); }
}

async function renameSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const title = prompt('重命名会话：', s.title);
  if (!title || title === s.title) return;
  const hash = s.projectHash || s.projectPath?.split(/[/\\]/).pop() || getCurrentHash();
  try {
    await fetch(API + '/projects/' + hash + '/sessions/' + id + '/rename', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title.trim() })
    });
    await loadSessions();
    showToast('已重命名', 'success');
  } catch (e) { showToast('重命名失败', 'error'); }
}

function getCurrentHash() {
  // Try to get hash from current project info
  const el = document.getElementById('srvDir');
  if (el && el.textContent !== '-') {
    const parts = el.textContent.trim().split(/[/\\]/);
    return parts[parts.length - 1] || 'default';
  }
  return 'default';
}

async function deleteSession(id) {
  if (!confirm('确定要删除此会话吗？')) return;
  const s = sessions.find(x => x.id === id);
  const hash = s?.projectHash || s?.projectPath?.split(/[/\\]/).pop() || getCurrentHash();
  try {
    await fetch(API + '/projects/' + hash + '/sessions/' + id, { method: 'DELETE' });
    sessions = sessions.filter(s => s.id !== id);
    if (currentSession?.id === id) {
      currentSession = sessions.length > 0 ? sessions[0] : null;
      currentSession ? renderMessages(currentSession.messages || []) : renderMessages([]);
    }
    renderSessions();
    showToast('会话已删除', 'success');
  } catch (e) { showToast('删除失败', 'error'); }
}

// ── Messages ──
function renderMessages(msgs) {
  const area = document.getElementById('chatArea');
  if (!msgs || msgs.length === 0) {
    area.innerHTML = '';
    // Re-create empty state since innerHTML='' destroyed the original
    const emptyDiv = document.createElement('div');
    emptyDiv.className = 'chat-empty';
    emptyDiv.id = 'emptyState';
    emptyDiv.innerHTML = '<div class="big-icon">💬</div><p>选择或创建一个会话开始对话</p><div class="hint">AtomCode AI 编程助手</div>';
    area.appendChild(emptyDiv);
    updateMsgCount();
    return;
  }
  area.innerHTML = '';
  allMessages = msgs;
  for (const m of msgs) {
    addMsgElement(m.role, m.content, m.timestamp, m.images);
  }
  updateMsgCount();
  scrollChat();
}

function addMsgElement(role, content, timestamp, images) {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  if (empty && empty.parentNode) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatar = role === 'user' ? 'U' : '⚛';
  const roleName = role === 'user' ? '你' : 'AtomCode';

  // Build images HTML if present
  let imagesHtml = '';
  if (images && images.length > 0) {
    imagesHtml = '<div class="msg-images">';
    for (const img of images) {
      const src = img.url ? API + img.url : (img.dataUrl || '');
      if (src) imagesHtml += '<img src="' + escHtml(src) + '" onclick="previewImage(this.src)" title="点击查看大图">';
    }
    imagesHtml += '</div>';
  }

  div.innerHTML =
    '<div class="msg-avatar">' + avatar + '</div>' +
    '<div class="msg-body">' +
      '<div class="msg-meta">' +
        '<span class="msg-role">' + roleName + '</span>' +
        '<span class="msg-time">' + (timestamp ? formatTimeFull(timestamp) : '') + '</span>' +
      '</div>' +
      imagesHtml +
      '<div class="msg-content">' + formatMarkdown(content) + '</div>' +
    '</div>' +
    '<button class="msg-copy-btn" onclick="copyMsg(this)" title="复制消息">📋</button>';

  area.appendChild(div);
  scrollChat();
  return div;
}

function appendStreamContent(content) {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  if (empty && empty.parentNode) empty.remove();

  let lastMsg = area.lastElementChild;
  if (!lastMsg || !lastMsg.classList.contains('assistant')) {
    // No assistant message yet. Try to find one in allMessages
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML =
      '<div class="msg-avatar">⚛</div>' +
      '<div class="msg-body">' +
        '<div class="msg-meta">' +
          '<span class="msg-role">AtomCode</span>' +
          '<span class="msg-time">' + formatTimeFull(new Date().toISOString()) + '</span>' +
        '</div>' +
        '<div class="msg-content"></div>' +
      '</div>' +
      '<button class="msg-copy-btn" onclick="copyMsg(this)" title="复制消息">📋</button>';
    area.appendChild(div);
    lastMsg = area.lastElementChild;
  }

  const contentEl = lastMsg.querySelector('.msg-content');
  if (contentEl) {
    // Use a data attr to accumulate raw text and re-render markdown
    const raw = (lastMsg.dataset.raw || '') + content;
    lastMsg.dataset.raw = raw;
    contentEl.innerHTML = formatMarkdown(raw) + '<span class="cursor"></span>';
  }
  scrollChat();
}

function finalizeStream() {
  const area = document.getElementById('chatArea');
  const lastMsg = area.lastElementChild;
  if (lastMsg && lastMsg.classList.contains('assistant')) {
    const contentEl = lastMsg.querySelector('.msg-content');
    const cursor = contentEl?.querySelector('.cursor');
    if (cursor) cursor.remove();
    if (lastMsg.dataset.raw) {
      contentEl.innerHTML = formatMarkdown(lastMsg.dataset.raw);
      delete lastMsg.dataset.raw;
    }
  }
}

function setStreamingStatus(v) {
  const area = document.getElementById('chatArea');
  let el = area.querySelector('.streaming-info');
  if (v) {
    streamStartTime = Date.now();
    if (!el) {
      el = document.createElement('div');
      el.className = 'streaming-info';
      el.innerHTML = '<span class="cursor"></span> AI 思考中... <span class="stream-time">0s</span>';
      area.appendChild(el);
    }
    streamTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - streamStartTime) / 1000);
      const t = el.querySelector('.stream-time');
      if (t) t.textContent = sec + 's';
    }, 1000);
  } else {
    if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
    if (el) el.remove();
    streamStartTime = null;
  }
}

// ── Chat API ──
async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  const imagesToSend = [...pendingImages]; // capture current pending images
  if (!msg && imagesToSend.length === 0) return;

  // Ensure session
  if (!currentSession) {
    await createSession();
    await new Promise(r => setTimeout(r, 100));
    if (!currentSession) { showToast('请先创建会话', 'error'); return; }
  }

  input.value = '';
  autoResize(input);
  clearPendingImages();

  // Show user message immediately (with local image previews)
  addMsgElement('user', msg || '(图片)', new Date().toISOString(), imagesToSend.map(i => ({ url: null, dataUrl: i.dataUrl })));

  // Start streaming
  setStreaming(true);
  setStreamingStatus(true);

  try {
    // Upload images first if any
    let uploadedImages = [];
    for (const img of imagesToSend) {
      try {
        const formData = new FormData();
        const blob = await fetch(img.dataUrl).then(r => r.blob());
        formData.append('image', blob, img.originalName || 'image.png');
        const upRes = await fetch(API + '/upload', { method: 'POST', body: formData });
        if (!upRes.ok) throw new Error('上传失败');
        const upData = await upRes.json();
        uploadedImages.push({ url: upData.url, originalName: img.originalName });
      } catch (e) {
        console.error('Image upload failed:', e);
        showToast('图片上传失败: ' + e.message, 'error');
      }
    }

    const body = { prompt: msg || '请描述这张图片', sessionId: currentSession.id };
    if (currentProvider) body.provider = currentProvider;
    if (currentModel) body.model = currentModel;
    if (uploadedImages.length > 0) body.images = uploadedImages;

    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || '请求失败: ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    let streamDone = false;
    while (!streamDone) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          // Track SSE event type for proper handling
          const eventType = line.slice(7).trim();
          if (eventType === 'done' || eventType === 'error' || eventType === 'stopped') {
            streamDone = true;
          }
        }
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'delta' && parsed.content) {
              appendStreamContent(parsed.content);
            }
            if (parsed.type === 'error') {
              // Show error message in chat
              appendStreamContent('\n\n⚠️ ' + (parsed.content || '未知错误'));
            }
            if (parsed.type === 'done' || parsed.type === 'error' || parsed.type === 'stopped') {
              streamDone = true;
              break;
            }
          } catch (e) { /* skip malformed */ }
        }
      }
    }

    finalizeStream();

    // Reload session to get updated messages (with server-side image URLs)
    await loadSessions();
    if (currentSession) {
      const updated = sessions.find(s => s.id === currentSession.id);
      if (updated) currentSession = updated;
      // Re-render from server data so images use proper URLs
      if (currentSession && currentSession.messages) {
        renderMessages(currentSession.messages);
      }
    }

  } catch (e) {
    console.error('Chat error:', e);
    const area = document.getElementById('chatArea');
    const errDiv = document.createElement('div');
    errDiv.className = 'msg error status';
    errDiv.innerHTML = '<div class="msg-content">⚠️ ' + escHtml(e.message) + '</div>';
    area.appendChild(errDiv);
    showToast('请求失败: ' + e.message, 'error');
  }

  setStreaming(false);
  setStreamingStatus(false);
  updateMsgCount();
  scrollChat();
}

async function stopChat() {
  try {
    await fetch(API + '/chat/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSession?.id || '' })
    });
  } catch (e) { /* ignore */ }
  setStreaming(false);
  setStreamingStatus(false);
  finalizeStream();
}

function setStreaming(v) {
  isStreaming = v;
  const btn = document.getElementById('sendBtn');
  if (v) {
    btn.className = 'btn-send stop';
    btn.textContent = '■';
    btn.onclick = stopChat;
  } else {
    btn.className = 'btn-send send';
    btn.textContent = '▶';
    btn.onclick = sendMessage;
  }
}

function updateMsgCount() {
  const el = document.getElementById('msgCount');
  if (!el) return;
  const count = allMessages.length || 0;
  el.textContent = count > 0 ? count + ' 条消息' : '';
}

// ── Copy Message ──
function copyMsg(btn) {
  const contentEl = btn.parentNode.querySelector('.msg-content');
  if (!contentEl) return;
  const text = contentEl.textContent || contentEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    showToast('复制失败', 'error');
  });
}

// ── Settings ──
async function showSettings() {
  const modal = document.getElementById('settingsModal');
  modal.classList.add('visible');

  try {
    const health = await checkHealth();
    if (health) {
      document.getElementById('srvStatus').textContent = '运行中';
      document.getElementById('srvVersion').textContent = health.version || '-';
      const uptime = health.uptime || 0;
      const h = Math.floor(uptime / 3600);
      const m = Math.floor((uptime % 3600) / 60);
      const s = Math.floor(uptime % 60);
      document.getElementById('srvUptime').textContent = h + 'h ' + m + 'm ' + s + 's';
      document.getElementById('srvCli').textContent = health.cliAvailable ? '✅ 可用' : '❌ 不可用';
    } else {
      document.getElementById('srvStatus').textContent = '❌ 断开';
    }
  } catch (e) {
    document.getElementById('srvStatus').textContent = '❌ 断开';
  }

  const proj = await loadProject();
  if (proj) {
    document.getElementById('srvDir').textContent = proj.currentDir || '-';
  }
  document.getElementById('srvSessions').textContent = sessions.length;
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('visible');
}

// Close modal on overlay click
document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

// ── Directory Change ──
async function changeDir() {
  const input = document.getElementById('dirInput');
  const path = input.value.trim();
  if (!path) {
    showToast('请输入项目路径', 'error');
    return;
  }
  try {
    const res = await fetch(API + '/cd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    const data = await res.json();
    if (data.error) {
      showToast('切换失败: ' + data.error, 'error');
      return;
    }
    document.getElementById('srvDir').textContent = data.currentDir || '-';
    input.value = '';
    showToast('目录已切换: ' + data.currentDir, 'success');
    // Reload project info in top bar
    loadProject();
  } catch (e) {
    showToast('切换失败: ' + e.message, 'error');
  }
}

// Allow Enter key to trigger directory change
document.addEventListener('DOMContentLoaded', () => {
  const dirInput = document.getElementById('dirInput');
  if (dirInput) {
    dirInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') changeDir();
    });
  }
});

// ── Search ──
function onSearchInput() {
  const q = document.getElementById('sessionSearch').value.toLowerCase();
  const items = document.querySelectorAll('.session-item');
  for (const item of items) {
    const title = item.querySelector('.sess-title');
    const match = !q || (title && title.textContent.toLowerCase().includes(q));
    item.style.display = match ? '' : 'none';
  }
}

// ── Toast ──
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ── Helpers ──
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);

  // Code blocks with language - wrap in pre with header
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
    const langLabel = lang ? lang : 'code';
    const copyId = 'cb-' + Math.random().toString(36).slice(2, 8);
    return '<pre><div class="code-header"><span class="lang">' + langLabel + '</span><button class="copy-btn" onclick="copyCodeBlock(\'' + copyId + '\')">📋 复制</button></div><code id="' + copyId + '">' + code.trim() + '</code></pre>';
  });

  // Inline code (must be after code blocks)
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Headers
  html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^## (.+)$/gm, '<strong style="font-size:15px">$1</strong>');
  html = html.replace(/^# (.+)$/gm, '<strong style="font-size:17px">$1</strong>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered list
  html = html.replace(/^[-*]\s(.+)$/gm, '• $1');

  // Ordered list (basic)
  html = html.replace(/^\d+\.\s(.+)$/gm, function(m, c) {
    const idx = Math.random().toString(36).slice(2, 4);
    return '<span style="display:block;margin-left:0">$1</span>';
  });

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Tables (basic)
  html = html.replace(/\|(.+)\|/g, function(m, content) {
    const cells = content.split('|').map(c => c.trim()).filter(c => c);
    if (cells.length === 0) return m;
    // Check if it's a separator row
    if (cells.every(c => /^:?-+:?$/.test(c))) return '';
    return '<tr><td>' + cells.join('</td><td>') + '</td></tr>';
  });

  // Line breaks
  html = html.replace(/\n/g, '<br>');
  // Clean up double br
  html = html.replace(/(<br>\s*){3,}/g, '<br><br>');

  return html;
}

function copyCodeBlock(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.parentNode.previousElementSibling?.querySelector('.copy-btn') || el.closest('pre')?.querySelector('.copy-btn');
    if (btn) {
      btn.textContent = '✅ 已复制';
      setTimeout(() => { btn.textContent = '📋 复制'; }, 2000);
    }
  }).catch(() => { showToast('复制失败', 'error'); });
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h';
  return d.toLocaleDateString('zh-CN', { month:'short', day:'numeric' });
}

function formatTimeFull(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}

function scrollChat() {
  const area = document.getElementById('chatArea');
  requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function onKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Image Upload ──
function triggerUpload() {
  document.getElementById('imageInput').click();
}

function onImageSelected(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    addPendingImage(file);
  }
  event.target.value = ''; // reset so same file can be selected again
}

function addPendingImage(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      dataUrl: e.target.result,
      originalName: file.name,
    };
    pendingImages.push(img);
    renderPendingImages();
  };
  reader.readAsDataURL(file);
}

function removePendingImage(id) {
  pendingImages = pendingImages.filter(i => i.id !== id);
  renderPendingImages();
}

function clearPendingImages() {
  pendingImages = [];
  renderPendingImages();
}

function renderPendingImages() {
  const area = document.getElementById('imagePreviewArea');
  if (!area) return;
  area.innerHTML = '';
  for (const img of pendingImages) {
    const item = document.createElement('div');
    item.className = 'image-preview-item';
    item.innerHTML =
      '<img src="' + escHtml(img.dataUrl) + '">' +
      '<button class="remove-btn" onclick="removePendingImage(\'' + img.id + '\')">&times;</button>';
    area.appendChild(item);
  }
}

function setupDragDrop() {
  const overlay = document.getElementById('dropOverlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    if (overlay) overlay.classList.add('active');
  });

  document.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      if (overlay) overlay.classList.remove('active');
    }
  });

  document.addEventListener('dragover', function(e) {
    e.preventDefault();
  });

  document.addEventListener('drop', function(e) {
    e.preventDefault();
    dragCounter = 0;
    if (overlay) overlay.classList.remove('active');
    const files = e.dataTransfer.files;
    if (!files || files.length === 0) return;
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      addPendingImage(file);
    }
  });
}

function previewImage(src) {
  // Simple fullscreen preview
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
  overlay.onclick = function() { overlay.remove(); };
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;';
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

// Keyboard shortcut: Ctrl+Shift+N = new session
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'N') {
    e.preventDefault();
    createSession();
  }
});

// Expose to HTML
window.createSession = createSession;
window.loadSessions = loadSessions;
window.onProviderChange = onProviderChange;
window.onModelChange = onModelChange;
window.sendMessage = sendMessage;
window.stopChat = stopChat;
window.onKeydown = onKeydown;
window.autoResize = autoResize;
window.showSettings = showSettings;
window.closeSettings = closeSettings;
window.changeDir = changeDir;
window.copyMsg = copyMsg;
window.copyCodeBlock = copyCodeBlock;
window.deleteSession = deleteSession;
window.renameSession = renameSession;
window.onSearchInput = onSearchInput;
window.showToast = showToast;

// ── Start ──
init();
</script>
